<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Management System - Login</title>
  <meta name="description" content="Sign in to your account - Management System">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">
  <main class="login-wrapper">
    <!-- Brand Logo Circle -->
    <div class="login-brand-logo" aria-label="Management System Logo">
      M
    </div>

    <!-- Header -->
    <div class="login-header">
      <h1 class="login-title">Welcome Back!</h1>
      <p class="login-subtitle">Sign in to continue to your account</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <h2 class="card-heading">Login to your account</h2>
      <p class="card-subheading">Enter your email and password to get started.</p>

      <form id="loginForm" autocomplete="on">
        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="name@example.com"
            required
            autocomplete="email"
          >
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="label-row">
            <label for="password" class="form-label">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <button type="button" id="togglePassword" class="btn-toggle-password">Show</button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="form-check">
          <input type="checkbox" id="rememberMe" name="rememberMe">
          <label for="rememberMe">Remember me</label>
        </div>

        <!-- Sign In Button -->
        <button type="submit" class="btn-submit" id="signInBtn">
          Sign In
        </button>
      </form>

      <!-- Bottom Card Link -->
      <div class="login-card-footer">
        Don't have an account? <a href="#" class="create-account-link">Create an account</a>
      </div>
    </div>

    <!-- Site Footer -->
    <footer class="login-site-footer">
      &copy; 2026 My Website. All rights reserved.
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
